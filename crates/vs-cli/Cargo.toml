[package]
name = "vs-cli"
description = "Stateless CLI for vibesurfer; talks to vibesurferd over a Unix socket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "vs"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
vs-protocol = { path = "../vs-protocol" }
vs-daemon = { path = "../vs-daemon" }
vs-engine-webkit = { path = "../vs-engine-webkit" }
vs-store = { path = "../vs-store" }
clap = { version = "4", features = ["derive", "wrap_help"] }
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "io-util", "macros", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSDate", "NSRunLoop"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = "0.11"
glib = "0.22"

[dev-dependencies]
tempfile = "3"
# Local HTTP fixture server for integration tests against real WebKit
# backends. tiny_http is single-dep (ascii), blocking, ~1400 LOC; the
# fixture server module needs random-port bind, basic routing, status
# codes, redirects, cookies, and slow-response simulation. Hand-rolling
# all of that costs more code than the rest of the harness combined.
# Dev-only — never compiled into the shipped vs binary.
tiny_http = "0.12"
