[package]
name = "vibesurfer"
description = "A real browser for your local AI agent."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "vs"
path = "src/main.rs"

[lib]
name = "vs_cli"
path = "src/lib.rs"

[dependencies]
vs-protocol = { path = "../vs-protocol", version = "0.1.8" }
vs-daemon = { path = "../vs-daemon", version = "0.1.8" }
vs-engine-webkit = { path = "../vs-engine-webkit", version = "0.1.8" }
vs-store = { path = "../vs-store", version = "0.1.8" }
clap = { version = "4", features = ["derive", "wrap_help"] }
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "io-util", "io-std", "macros", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
interprocess = "2.4.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSDate", "NSRunLoop"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = "0.11"
glib = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
tempfile = "3"
# Local HTTP fixture server for integration tests against real WebKit
# backends. tiny_http is single-dep (ascii), blocking, ~1400 LOC; the
# fixture server module needs random-port bind, basic routing, status
# codes, redirects, cookies, and slow-response simulation. Hand-rolling
# all of that costs more code than the rest of the harness combined.
# Dev-only — never compiled into the shipped vs binary.
tiny_http = "0.12"
