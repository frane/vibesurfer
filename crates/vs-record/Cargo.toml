[package]
name = "vs-record"
description = "Session-video encoding for vibesurfer: H.264 MP4, VP8 WebM, AV1."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# rav1e: pure-Rust AV1, asm disabled so it needs no nasm. Portable
# fallback encoder; slow (not real time at 1440p).
rav1e = { version = "0.8", default-features = false }
# openh264: real-time H.264, cross-platform. Built from vendored source
# (needs nasm at build time) so the binary stays self-contained. Output
# muxed to MP4 (muxide), which plays everywhere without a remux step.
openh264 = "0.9"
muxide = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
thiserror = "2"

[features]
default = ["webm"]
# libvpx (VP8) for WebM recordings, Playwright's video format. build.rs
# generates the bindings (needs clang); release builds link libvpx
# statically (VPX_STATIC=1), so the binary needs no libvpx installed.
webm = []

[build-dependencies]
bindgen = "0.73"
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3"
