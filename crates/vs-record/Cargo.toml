[package]
name = "vs-record"
description = "AV1 session-video encoding for vibesurfer (pure-Rust, rav1e)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# asm disabled on purpose: keeps the encoder pure-Rust so CI needs no
# nasm and the binary stays self-contained. Slower encode, portable.
rav1e = { version = "0.8", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
