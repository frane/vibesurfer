[package]
name = "vs-mcp"
description = "Full MCP (Model Context Protocol) server for vibesurfer. Stdio JSON-RPC; each of the 19 primitives is one MCP tool. Dispatches through vs-cli's `commands::run`, so the engine code path is identical to the CLI's."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "vs-mcp"
path = "src/main.rs"

[dependencies]
vs-cli = { path = "../vs-cli" }
vs-protocol = { path = "../vs-protocol" }
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "io-std", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
