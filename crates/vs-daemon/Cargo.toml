[package]
name = "vs-daemon"
description = "Daemon that owns the browser engine for vibesurfer."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
vs-protocol = { path = "../vs-protocol", version = "0.2.22" }
vs-store = { path = "../vs-store", version = "0.2.22" }
vs-record = { path = "../vs-record", version = "0.2.22" }
vs-engine-webkit = { path = "../vs-engine-webkit", version = "0.2.22" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "io-util", "macros", "signal", "time"] }
blake3 = "1"
thiserror = "2"
base64 = "0.22.1"
ring = "0.17"
anyhow = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v7", "fast-rng"] }
serde_json = "1"
interprocess = { version = "2.4.2", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14.7", default-features = false, features = ["ring", "pem"] }
webpki-roots = "1.0.12"
time = "0.3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "io-util", "macros", "time", "test-util"] }
vs-engine-webkit = { path = "../vs-engine-webkit", version = "0.2.22", features = ["test-support"] }
