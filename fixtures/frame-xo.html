<!doctype html>
<html>
<head><meta charset="utf-8"><title>Cross-origin frame</title></head>
<body>
  <h1>Outer page</h1>
  <!-- Same port, other host: a cross-origin frame the page's script cannot reach. -->
  <iframe id="xo" title="Cross-origin frame"></iframe>
  <script>
    var other = location.hostname === 'localhost' ? '127.0.0.1' : 'localhost';
    document.getElementById('xo').src = location.protocol + '//' + other + ':' + location.port + '/frame-inner.html';
  </script>
</body>
</html>
