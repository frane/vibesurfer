<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

      "@context": "https://schema.org",
      "@type": "Product",
      "name": "Demo Widget",
      "sku": "demo-001",

    }

  <script type="application/x-webmcp">

<body>
  <main>
    <h1>Extract page</h1>

    <table id="people">
