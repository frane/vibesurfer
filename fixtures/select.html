<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>select fill</title></head>
<body>
  <select id="s">
    <option value="rest">HTTP REST API</option>
    <option value="sdk">SDK / npm Package</option>
    <option value="cli">CLI Tool</option>
  </select>
  <pre id="log">none</pre>
  <script>
    // Records the committed value + that a native change fired, so the
    // regression test can assert `act fill` on a <select> matched an
    // option by label and dispatched change (React onChange path).
    document.getElementById('s').addEventListener('change', function (e) {
      document.getElementById('log').textContent = 'changed:' + e.target.value;
    });
  </script>
</body>
</html>
