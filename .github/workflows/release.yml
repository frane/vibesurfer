name: release

# Tag-driven release pipeline. On `v*` tag push, build `vs` for each
# target triple and upload the artifacts to the matching GitHub
# Release. The install.sh in this repo expects asset names of the
# form `vs-<version>-<target>.tar.gz` (`.zip` on Windows), so the
# archive job below uses the same convention.
#
# Trigger:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Manual re-run is also possible via the workflow_dispatch entry.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to build (e.g. v0.1.0). Required for manual runs."
        required: true
        type: string

permissions:
  contents: write
  # npm OIDC trusted publishing needs the Actions id-token. See the
  # `npm` job at the bottom.
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cross-build x86_64 darwin from the Apple Silicon runner.
          # macos-13 (Intel) is in GitHub's runner pool but allocations
          # routinely stall in queue for hours; cross-compile from
          # macos-latest (arm64) with the second target installed
          # produces a native x86_64 mach-o just the same.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/setup-nasm@v1  # openh264 (vs-record) builds from source
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkitgtk-6.0-dev \
            libgtk-4-dev \
            libsoup-3.0-dev \
            pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          # On tag push, GITHUB_REF_NAME is the tag. On
          # workflow_dispatch the user supplies the tag.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: cargo build --release
        run: cargo build --release --bin vs --target ${{ matrix.target }} --locked

      - name: Stage archive
        id: stage
        shell: bash
        run: |
          version="${{ steps.ver.outputs.version }}"
          target="${{ matrix.target }}"
          stage="$(mktemp -d)"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${target}/release/vs.exe" "${stage}/"
          else
            cp "target/${target}/release/vs" "${stage}/"
          fi
          cp README.md LICENSE "${stage}/"
          archive_base="vs-${version}-${target}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            archive="${archive_base}.zip"
            (cd "${stage}" && 7z a "../${archive}" .)
            mv "${stage}/../${archive}" "${archive}"
          else
            archive="${archive_base}.tar.gz"
            tar -czf "${archive}" -C "${stage}" .
          fi
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        id: upload
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.stage.outputs.archive }}
          tag_name: ${{ steps.ver.outputs.version }}
          # On workflow_dispatch the tag may not exist yet; in that
          # case action-gh-release creates it at the built commit, so
          # a manual run is a full release, not just an artifact drop.
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true

      # The upload above failed three times across two releases on one
      # day, each time with GitHub's HTML error page rather than an API
      # error — infrastructure, not the payload. A failed upload also
      # skips the checksums job, so the release is left incomplete and
      # somebody has to notice and re-run it by hand. Retry here
      # instead. The tag exists by this point on a tag-triggered run,
      # so a plain upload is enough; --clobber makes a retry after a
      # partial success idempotent.
      - name: Retry upload if it failed
        if: steps.upload.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if gh release upload "${{ steps.ver.outputs.version }}" \
                 "${{ steps.stage.outputs.archive }}" --clobber; then
              echo "uploaded on attempt ${attempt}"
              exit 0
            fi
            echo "upload attempt ${attempt} failed; retrying"
            sleep $((attempt * 15))
          done
          echo "upload still failing after 3 retries"
          exit 1

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir staging
          cd staging
          gh release download "${{ steps.ver.outputs.version }}" --pattern 'vs-*' --repo "${GITHUB_REPOSITORY}"
          sha256sum vs-* > checksums.txt
      - name: Upload checksums
        uses: softprops/action-gh-release@v2
        with:
          files: staging/checksums.txt
          tag_name: ${{ steps.ver.outputs.version }}

  # npm is the one channel a release cannot finish on its own. The
  # launcher in npm/ downloads the release assets by tag, so publishing
  # before they exist makes `npx vibesurfer` 404 — hence `needs:
  # checksums`, which only completes once every asset is uploaded.
  #
  # Authentication is OIDC trusted publishing, the same shape the
  # almyty repos use: npm authenticates with the Actions id-token
  # against the trusted publisher configured on npmjs.com for this
  # repo + workflow filename. No NPM_TOKEN, nothing to rotate, and
  # --provenance attests the build to the registry.
  #
  # A long-lived token is what caused the problem this job exists to
  # solve: 0.2.4, 0.2.5 and 0.2.6 shipped everywhere except npm
  # because the maintainer's local token had been revoked months
  # earlier while `npm whoami` still resolved off it, so nothing
  # looked wrong until a publish was attempted. A credential that
  # cannot silently rot is the actual fix.
  #
  # One-time setup: on npmjs.com, add a trusted publisher to the
  # `vibesurfer` package for frane/vibesurfer with workflow
  # `release.yml`. Until that exists this job fails rather than
  # skipping — a release quietly missing from npm is the failure
  # mode we are trying to stop repeating.
  npm:
    name: npm publish
    needs: checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        run: |
          # Trusted publishing needs npm >= 11.5; the runner's bundled
          # npm is older than that for a while yet.
          npm install -g npm@latest
          # The tag is the source of truth. A package.json that drifted
          # from it would publish a version nobody tagged, so fail
          # loudly rather than guess which one was meant.
          tag_version="${{ steps.ver.outputs.version }}"
          pkg_version="v$(node -p "require('./npm/package.json').version")"
          if [ "${tag_version}" != "${pkg_version}" ]; then
            echo "tag ${tag_version} does not match npm/package.json ${pkg_version}"
            exit 1
          fi
          cd npm
          npm publish --access public --provenance
