name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkitgtk-6.0-dev \
            libgtk-4-dev \
            libsoup-3.0-dev \
            pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkitgtk-6.0-dev \
            libgtk-4-dev \
            libsoup-3.0-dev \
            pkg-config \
            xvfb
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (with virtual display on Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run --auto-servernum cargo test --workspace --all-targets --locked
      - name: cargo test
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --workspace --all-targets --locked

  build:
    name: cargo build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkitgtk-6.0-dev \
            libgtk-4-dev \
            libsoup-3.0-dev \
            pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked

  wk-smoke:
    name: macOS WkBackend smoke (real WKWebView)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo run --example wk_smoke
        run: |
          cargo run --quiet --example wk_smoke -- \
            "data:text/html,<h1>CI smoke</h1><button>OK</button><a href=%23>link</a>" \
            > /tmp/wk_smoke.out 2>&1
          cat /tmp/wk_smoke.out
          # Assert the snapshot found the heading and the link.
          grep -q 'hd "CI smoke"' /tmp/wk_smoke.out
          grep -q 'lnk "link"'    /tmp/wk_smoke.out
          # Assert a real PNG was written.
          PNG=$(grep '^CAPTURE_PATH=' /tmp/wk_smoke.out | head -1 | cut -d= -f2-)
          test -s "$PNG"
          file "$PNG" | grep -q "PNG image data"
