[workspace]
resolver = "2"
members = [
    "crates/vs-cli",
    "crates/vs-daemon",
    "crates/vs-humanize",
    "crates/vs-protocol",
    "crates/vs-store",
    "crates/vs-engine-webkit",
]

[workspace.package]
version = "0.1.6"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Frane Bandov <frane.bandov@gmail.com>"]
repository = "https://github.com/frane/vibesurfer"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
